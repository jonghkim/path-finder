<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pathfinder</title>
  <link rel="icon" href="favicon.ico">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="stylesheet" href="assets/style.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.2.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.2.1/firebase-auth.js"></script>
  <script src="assets/firebase-config.js"></script>
</head>
<body class="login-body">
  <main class="login">
    <div class="login-card" id="loginCard" aria-busy="true">
      <div class="login-brand">
        <span class="login-mark" aria-hidden="true"></span>
        <h1>Pathfinder</h1>
      </div>
      <p class="login-motto" id="loginMotto">끝날 때까지는 끝난 게 아니다.</p>

      <form id="loginForm" autocomplete="on" novalidate>
        <label class="field">
          <span>Username</span>
          <input id="username" name="username" type="text" autocomplete="username" autocapitalize="off" spellcheck="false" required>
        </label>
        <label class="field">
          <span>Password</span>
          <input id="password" name="password" type="password" autocomplete="current-password" required minlength="6">
        </label>
        <p class="login-error" id="loginError" role="alert" hidden></p>
        <button class="btn btn-primary btn-block" type="submit" id="submitBtn">Sign in</button>
        <button class="btn btn-ghost btn-block" type="button" id="toggleMode">Create an account</button>
      </form>
    </div>
    <p class="login-foot">Private. Your notes are encrypted before they leave the browser.</p>
  </main>

  <script>
    (function () {
      firebase.initializeApp(window.PF_FIREBASE_CONFIG);
      var auth = firebase.auth();
      var mode = 'signin';
      var card = document.getElementById('loginCard');
      var form = document.getElementById('loginForm');
      var err = document.getElementById('loginError');
      var submitBtn = document.getElementById('submitBtn');
      var toggle = document.getElementById('toggleMode');
      var mottos = ['끝날 때까지는 끝난 게 아니다.', '길고 짧은 건 대봐야 안다.', 'Try again from a different angle.'];
      document.getElementById('loginMotto').textContent = mottos[Math.floor(Math.random() * mottos.length)];

      auth.onAuthStateChanged(function (user) {
        if (user) { window.location.replace('app.html'); return; }
        card.removeAttribute('aria-busy');
        document.getElementById('username').focus();
      });

      function showError(msg) { err.textContent = msg; err.hidden = false; }
      function busy(b) { submitBtn.disabled = b; submitBtn.textContent = b ? '…' : (mode === 'signin' ? 'Sign in' : 'Create account'); }

      toggle.addEventListener('click', function () {
        mode = mode === 'signin' ? 'signup' : 'signin';
        err.hidden = true;
        submitBtn.textContent = mode === 'signin' ? 'Sign in' : 'Create account';
        toggle.textContent = mode === 'signin' ? 'Create an account' : 'I already have an account';
        document.getElementById('password').autocomplete = mode === 'signin' ? 'current-password' : 'new-password';
      });

      form.addEventListener('submit', function (e) {
        e.preventDefault();
        err.hidden = true;
        var u = document.getElementById('username').value.trim();
        var p = document.getElementById('password').value;
        if (!u) return showError('Enter a username.');
        if (p.length < 6) return showError('Password needs at least 6 characters.');
        var email = u + '@yourdomain.com';
        busy(true);
        var op = mode === 'signin' ? auth.signInWithEmailAndPassword(email, p) : auth.createUserWithEmailAndPassword(email, p);
        op.catch(function (e2) {
          busy(false);
          var code = e2 && e2.code || '';
          var msg = {
            'auth/wrong-password': 'Wrong password.',
            'auth/user-not-found': 'No account with that username.',
            'auth/email-already-in-use': 'That username is taken.',
            'auth/too-many-requests': 'Too many attempts. Try again in a bit.',
            'auth/network-request-failed': 'Network error. Check your connection.'
          }[code] || (e2 && e2.message) || 'Something went wrong.';
          showError(msg);
        });
      });
    })();
  </script>
</body>
</html>
